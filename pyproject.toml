
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-r2-backup"
version = "1.0.11"
description = "PostgreSQL backup automation tool for S3-compatible storage"
readme = "README.md"
requires-python = ">=3.9"

authors = [
    { name = "Aman" }
]

license = "MIT"

dependencies = [
    "boto3",
    "python-dotenv",
    "schedule>=1.2.2",
    "py7zr",
    "filelock",
    "pytz==2026.5"
]

[project.urls]
Homepage = "https://github.com/BigDaddyAman/pg-r2-backup"
Repository = "https://github.com/BigDaddyAman/pg-r2-backup"
Issues = "https://github.com/BigDaddyAman/pg-r2-backup/issues"

[tool.setuptools]
packages = ["cli"]
py-modules = ["main", "config"]

[project.scripts]
pg-r2-backup = "cli.cli:main"